name: Deploy to GitHub Pages

# 单一内容源：仓库根目录只保留一份正文（.md 与 index.html）。
# 构建时由 tools/build_md.py 把 .md 渲染成 HTML 阅读页，再统一发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render Markdown to HTML
        run: python3 tools/build_md.py

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R rag-evaluation-tutorial agent-evaluation-tutorial agent-eval-driven-tutorial _site/
          echo "Published files: $(find _site -type f | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
