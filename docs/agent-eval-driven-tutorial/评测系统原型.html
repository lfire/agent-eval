<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 应用智能评测平台 · 交互原型</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1c2434; --muted:#6b7689; --line:#e5e9f0;
  --brand:#3b5bdb; --brand-soft:#eef2ff; --brand-2:#2563eb;
  --green:#12a150; --green-soft:#e8f8ef; --red:#e5484d; --red-soft:#fdecee;
  --orange:#f0921b; --orange-soft:#fff4e3; --purple:#8b5cf6; --purple-soft:#f3efff;
  --code:#111827; --shadow:0 1px 3px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.035);
  --topbarH:56px; --headerH:102px;   /* 由 syncHeader() 按实际行高动态覆盖 */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}

/* ---------- 左侧栏 ---------- */
.rail{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.brand{padding:14px 18px;border-bottom:1px solid var(--line);height:var(--headerH);
  display:flex;flex-direction:column;justify-content:center;flex:none}
.brand .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.2px}
.brand .logo i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3b5bdb,#7c3aed);color:#fff;font-style:normal;font-size:14px}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.nav{padding:12px 10px;border-bottom:1px solid var(--line)}
.nav .t{font-size:10.5px;font-weight:800;color:#98a2b3;letter-spacing:1.2px;padding:0 8px 7px}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  color:#4a5568;font-size:13.2px;font-weight:600;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:#f5f7fb;text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav a .ic{width:17px;text-align:center;font-size:14px}
.runs{flex:1;padding:12px 12px 8px;min-height:0;display:flex;flex-direction:column}
.runs h4{font-size:12px;margin:0 0 9px;display:flex;align-items:center;justify-content:space-between;color:#344054}
.runs h4 span{font-size:10.5px;color:#98a2b3;font-weight:500}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;background:#fafbfe;margin-bottom:9px}
.srch input{border:0;outline:0;background:none;width:100%;font-size:12px;color:var(--ink)}
.srch .mag{color:#98a2b3;font-size:12px}
.runlist{overflow-y:auto;flex:1;padding-right:2px}
.run{width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:9px;
  padding:8px 9px;margin-bottom:5px;display:block}
.run:hover{background:#f7f9fd}
.run.on{background:var(--brand-soft);border-color:#c9d6ff}
.run .id{font-family:ui-monospace,Menlo,monospace;font-size:10.8px;color:#5a667c;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.run .r2{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.run .rate{font-size:14px;font-weight:800}
.run .rate.hi{color:var(--green)}.run .rate.mid{color:var(--orange)}.run .rate.lo{color:var(--red)}
.run .nums{font-size:10.5px;color:var(--muted)}
.run .time{font-size:10px;color:#98a2b3;margin-top:2px}
.railfoot{padding:9px 12px 14px;border-top:1px solid var(--line);font-size:10.5px;color:#98a2b3;
  display:flex;justify-content:space-between;align-items:center}
.railfoot select{border:1px solid var(--line);border-radius:6px;font-size:10.5px;padding:2px 5px;background:#fff}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);
  padding:11px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .crumb{font-weight:800;font-size:15px;margin-right:6px;white-space:nowrap}
.topbar .crumb small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:8px}
.pill-sel{position:relative}
.pill-sel>button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;color:#344054;min-width:158px;justify-content:space-between}
.pill-sel>button:hover{border-color:#b9c6f5}
.scopepanel{position:absolute;top:calc(100% + 7px);left:0;width:330px;background:#fff;
  border:1px solid #dbe3f2;border-radius:12px;box-shadow:0 16px 40px rgba(20,35,70,.16);padding:12px;display:none;z-index:60}
.scopepanel.open{display:block}
.scopepanel .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scopepanel h5{margin:0 0 7px;font-size:11px;color:#7a869c;letter-spacing:.5px}
.scopepanel .opt{display:block;width:100%;text-align:left;border:0;background:#f7f9fd;
  border-radius:7px;padding:6px 9px;font-size:12px;margin-bottom:4px;color:#344054}
.scopepanel .opt:hover{background:#eef2ff}
.scopepanel .opt.on{background:var(--brand);color:#fff}
.btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:8px;
  padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#b9c6f5;color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#304fc4;color:#fff}
.btn.ghost{background:#f7f9fd}
.btn.sm{padding:5px 10px;font-size:11.5px}
.topbar .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
  border-radius:20px;padding:2px 9px;white-space:nowrap}
.b-blue{background:var(--brand-soft);color:var(--brand)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-orange{background:var(--orange-soft);color:#b26a00}
.b-purple{background:var(--purple-soft);color:#6d3ed6}
.b-gray{background:#f1f3f7;color:#667085}

.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;
  overflow-x:auto;position:sticky;top:var(--topbarH);z-index:24}
.tabs a{padding:11px 16px;font-size:13px;font-weight:600;color:#667085;white-space:nowrap;
  border-bottom:2px solid transparent;cursor:pointer}
.tabs a:hover{color:var(--brand)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand)}
.view{padding:22px 26px 70px;width:100%;max-width:none;min-width:0}
.view[hidden]{display:none}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-size:21px;margin:0 0 5px;letter-spacing:.2px}
.pagehead p{margin:0;color:var(--muted);font-size:12.5px}
.pagehead .hint{color:var(--red);font-size:12px;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;margin:0;display:flex;align-items:center;gap:8px}
.card-h .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.card-b{padding:16px 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.kpi{padding:16px 18px;text-align:center;position:relative}
.kpi .lab{font-size:12px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.kpi .val.g{color:var(--green)}.kpi .val.r{color:var(--red)}
.kpi .ring{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.taskstrip{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.taskrow{display:flex;align-items:center;gap:10px;border-radius:9px;padding:8px 12px;font-size:12px;border:1px solid transparent}
.taskrow.ok{background:var(--green-soft);border-color:#c8ecd8;color:#166534}
.taskrow.run{background:#eef4ff;border-color:#cddcfb;color:#1e40af}
.taskrow.cancel{background:#f5f6f8;border-color:#e3e6eb;color:#6b7280}
.taskrow .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskrow .st{font-weight:800;font-size:10.5px;letter-spacing:.4px}

/* 图表 */
.chartwrap{width:100%;overflow:hidden}
.chartwrap svg{width:100%;height:auto;display:block}
.metriclist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.metriclist .grp{font-size:11px;font-weight:800;color:#7a869c;margin:9px 0 5px;letter-spacing:.4px}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0}
.mrow .n{color:#4a5568}
.mrow .v{font-weight:800;font-variant-numeric:tabular-nums}
.mrow .v.g{color:var(--green)}.mrow .v.r{color:var(--red)}.mrow .v.o{color:#b26a00}
.scenerow{display:flex;align-items:center;gap:12px;margin:9px 0}
.scenerow .nm{width:120px;flex:none;font-size:12px;color:#4a5568;text-align:right}
.bar{flex:1;height:16px;background:#eef1f6;border-radius:9px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#28c76f,#12a150)}
.bar i.warn{background:linear-gradient(90deg,#f7b955,#f0921b)}
.bar i.bad{background:linear-gradient(90deg,#f28b8b,#e5484d)}
.scenerow .pc{width:52px;flex:none;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#f7f9fc;color:#5a667c;font-weight:700;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 11px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
.tbl tr:hover td{background:#fafbfe}
.tbl .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.case-row{cursor:pointer}
.case-detail td{background:#f8faff;padding:0}
.detail{padding:14px 18px 18px;border-left:3px solid var(--brand)}
.detail .dtitle{font-size:11px;font-weight:800;color:#7a869c;letter-spacing:.5px;margin:12px 0 5px}
.detail .reason{background:var(--red-soft);border:1px solid #f7c9cc;color:#a5212a;
  border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.75}
.detail .kv{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12px;margin-top:8px}
.detail .kv b{color:#5a667c;font-weight:600}
.iobox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepbox{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepbox .h{font-size:11px;font-weight:800;color:#7a869c;padding:7px 10px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.stepbox .r{display:flex;gap:8px;padding:5px 10px;font-size:11px;border-bottom:1px solid #f2f4f8}
.stepbox .r:last-child{border-bottom:0}
.stepbox .r .i{color:#98a2b3;width:18px;flex:none}
.stepbox .r .n{flex:1;font-family:ui-monospace,Menlo,monospace;color:#344054}
.stepbox .r .t{color:#98a2b3;font-variant-numeric:tabular-nums}
.stepbox .r .s{color:var(--green);font-weight:700}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;align-items:center;gap:6px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:11.5px;color:#4a5568}
.pager button:disabled{opacity:.45;cursor:not-allowed}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 13px;font-size:12px;color:#5a667c;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.mini-srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;min-width:210px}
.mini-srch input{border:0;outline:0;width:100%;font-size:12px}

/* 配置 / 任务 / 数据集 */
.notice{border-radius:9px;padding:10px 13px;font-size:12px;line-height:1.7;margin:12px 0}
.notice.ok{background:var(--green-soft);border:1px solid #c8ecd8;color:#166534}
.notice.info{background:#eef4ff;border:1px solid #cddcfb;color:#1e40af}
.notice.warn{background:#fff8ec;border:1px solid #f6dfae;color:#8a5b00}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:#5a667c;margin-bottom:5px;font-weight:600}
select.sel,input.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-size:12.5px;background:#fff;color:var(--ink);outline:0}
select.sel:focus,input.inp:focus{border-color:#9db2f7;box-shadow:0 0 0 3px rgba(59,91,219,.09)}
.ds-card{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;margin-bottom:9px;
  display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.ds-card:hover{border-color:#b9c6f5}
.ds-card.on{border-color:var(--brand);background:var(--brand-soft)}
.ds-card input{margin-top:3px;accent-color:var(--brand)}
.ds-card .t{font-size:12.5px;font-weight:700}
.ds-card .d{font-size:11px;color:var(--muted);margin-top:2px}
.radio-col{display:flex;flex-direction:column;gap:3px}
.radio-col label{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 8px;border-radius:7px;cursor:pointer}
.radio-col label:hover{background:#f7f9fd}
.radio-col label.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.radio-col label.dis{opacity:.4;cursor:not-allowed}
.radio-col input{accent-color:var(--brand)}
.chip{display:inline-block;font-size:11px;border-radius:6px;padding:3px 9px;margin:0 5px 5px 0;
  background:var(--brand-soft);color:var(--brand);font-weight:600}
.chip.gray{background:#f1f3f7;color:#667085}
.ind-card{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fbfcff;position:relative}
.ind-card .t{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ind-card .d{font-size:11px;color:var(--muted);margin:6px 0 9px;line-height:1.6;min-height:34px}
.ind-card .tags{display:flex;gap:5px;flex-wrap:wrap}
.ind-card .tags span{font-size:10px;background:#eef2f8;color:#5a667c;border-radius:4px;padding:2px 6px}
.ind-card .cfg{position:absolute;top:11px;right:12px;font-size:10px;color:var(--brand);font-weight:700}
.dset{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}
.dset .t{font-size:13px;font-weight:800;margin-bottom:4px}
.dset .sz{font-size:11px;color:var(--brand);font-weight:700}
.dset .d{font-size:11.5px;color:var(--muted);line-height:1.65;margin:8px 0}
.dset .m{font-size:11px;color:#4a5568;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px}
.arch-col{border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.arch-col .h{padding:10px 12px;color:#fff;font-size:12.5px;font-weight:800;text-align:center}
.arch-col .b{padding:11px 13px;font-size:11.5px;line-height:1.85;background:#fff}
.arch-col .b b{display:block;color:var(--brand);font-size:11px;margin:7px 0 2px}
.arch-col .b span{display:block;color:#4a5568;padding-left:9px;position:relative}
.arch-col .b span:before{content:"·";position:absolute;left:1px;color:#9aa7bd}
.flowstep{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;background:#fff;margin-bottom:9px}
.flowstep .no{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.flowstep .t{font-size:12.5px;font-weight:700}
.flowstep .d{font-size:11px;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:#1f2937;color:#fff;border-radius:10px;
  padding:11px 16px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:200;
  transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.footnote{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:#98a2b3;line-height:1.8}
@media(max-width:1240px){.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.rail{display:none}.view{padding:16px}.g3,.g2,.steps{grid-template-columns:1fr}.scenerow .nm{width:92px}}
@media print{.rail,.topbar,.tabs{display:none}.view{padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo"><i>◈</i><span>Agent Eval Platform</span></div>
      <div class="sub">AI Agent 精细化评测 · 交互原型</div>
    </div>
    <nav class="nav" id="nav">
      <div class="t">工作台</div>
      <a data-view="dashboard" class="on"><span class="ic">▦</span>评测看板</a>
      <a data-view="tasks"><span class="ic">▤</span>评测任务</a>
      <a data-view="results"><span class="ic">☰</span>评测结果</a>
      <a data-view="config"><span class="ic">⚙</span>评测配置</a>
      <div class="t" style="margin-top:10px">资产与原理</div>
      <a data-view="datasets"><span class="ic">◫</span>数据集与指标</a>
      <a data-view="engine"><span class="ic">↻</span>执行引擎</a>
    </nav>
    <div class="runs">
      <h4>评测记录 <span id="runCount"></span></h4>
      <div class="srch"><span class="mag">⌕</span><input id="runSearch" placeholder="搜索 Task ID"></div>
      <div class="runlist" id="runList"></div>
      <div class="railfoot"><span id="railPage"></span>
        <select id="railPageSize"><option>10条/页</option><option>20条/页</option></select>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">评测看板 <small>Agent 应用智能评测看板</small></div>
      <div class="pill-sel" id="scopeSel">
        <button id="scopeBtn"><span id="scopeLabel">选择评测范围</span><span>▾</span></button>
        <div class="scopepanel" id="scopePanel">
          <div class="grid">
            <div><h5>数据集（8 类）</h5><div id="scopeDatasets"></div></div>
            <div><h5>评测模式（7 种）</h5><div id="scopeModes"></div></div>
          </div>
        </div>
      </div>
      <button class="btn primary" id="btnSubmit">↗ 提交评测</button>
      <button class="btn" id="btnExport">⇩ 导出 JSON</button>
      <span class="sp"></span>
      <span class="badge b-blue" id="agentBadge">商品中心答疑Agent · qwen3-max</span>
      <span class="badge b-gray">静态原型 · 演示数据</span>
    </header>
    <div class="tabs" id="tabs">
      <a data-view="dashboard" class="on">评测看板</a>
      <a data-view="tasks">评测任务</a>

<script>
/* ============ 纯 SVG 图表（无外部依赖） ============ */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n) => Number(n).toLocaleString('zh-CN');
const colOf = (v) => v >= 85 ? 'var(--green)' : (v >= 70 ? '#d9820b' : 'var(--red)');
const short = (n) => String(n).replace(/\(.*?\)/g,'').replace(/（.*?）/g,'').slice(0,6);

function ring(pct){
  const r=32, c=2*Math.PI*r, dash=c*pct/100;
  return `<svg viewBox="0 0 80 80" width="66" height="66">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="#e9edf4" stroke-width="8"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="#12a150" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 40 40)"/>
    <text x="40" y="45" text-anchor="middle" font-size="14" font-weight="800" fill="#12a150">${pct.toFixed(1)}%</text>
  </svg>`;
}

function radar(axes, W){
  W = W || 360;                                   // 与容器像素 1:1，字体不再被拉伸放大
  const R = Math.min(88, 52 + W*0.072);
  const H = Math.round(2*(R*1.31 + 20));
  const cx = W/2, cy = H/2, n = axes.length;
  const pt=(i,f)=>{const a=(-90+i*360/n)*Math.PI/180;return [cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)];};
  const poly=(f)=>axes.map((_,i)=>pt(i,f).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g='';
  [0.25,0.5,0.75,1].forEach(f=>{g+=`<polygon points="${poly(f)}" fill="${f===1?'#f8faff':'none'}" stroke="#dbe3f2" stroke-width="1"/>`;});
  axes.forEach((_,i)=>{const [x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e3e9f4" stroke-width="1"/>`;});
  const dataPts=axes.map((a,i)=>pt(i,Math.max(0,Math.min(100,a.v))/100));
  g+=`<polygon points="${dataPts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}"
       fill="rgba(59,91,219,.20)" stroke="#3b5bdb" stroke-width="2"/>`;
  dataPts.forEach(p=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#3b5bdb"/>`;});
  axes.forEach((a,i)=>{
    const [x,y]=pt(i,1.31);
    const anchor = x < cx-8 ? 'end' : (x > cx+8 ? 'start' : 'middle');
    g+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}" font-size="9" fill="#5a667c">${esc(short(a.n))}</text>`;
    g+=`<text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${anchor}" font-size="8.5" font-weight="700" fill="${colOf(a.v)}">${a.v.toFixed(1)}%</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function hbar(bars, max, color, unit, W){
  W = W || 360;                                   // 与容器像素 1:1，字体不再被拉伸放大
  const rowH=30, x0=Math.min(190,Math.round(W*0.42)), bw=W-x0-26, H=bars.length*rowH+30;
  let g='';
  for(let k=0;k<=4;k++){
    const x=x0+bw*k/4;
    g+=`<line x1="${x}" y1="4" x2="${x}" y2="${bars.length*rowH+2}" stroke="#eef1f6" stroke-width="1"/>`;
    g+=`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="#98a2b3">${num(Math.round(max*k/4))}</text>`;
  }
  bars.forEach((b,i)=>{
    const y=i*rowH+9, w=Math.max(2,Math.min(bw,bw*b.v/max));
    g+=`<text x="${x0-8}" y="${y+12}" text-anchor="end" font-size="8.6" fill="#5a667c">${esc(b.n)}</text>`;
    g+=`<rect x="${x0}" y="${y}" width="${w.toFixed(1)}" height="14" rx="3" fill="${color}"/>`;
    const val=num(b.v)+(unit||'');
    if(x0+w+5+val.length*5.2 <= W-4){
      g+=`<text x="${(x0+w+5).toFixed(1)}" y="${y+11.5}" font-size="8.8" font-weight="700" fill="#4a5568">${val}</text>`;
    }else{
      g+=`<text x="${(x0+w-5).toFixed(1)}" y="${y+11.5}" text-anchor="end" font-size="8.8" font-weight="700" fill="#fff">${val}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function metricGroups(groups, unit, pct){
  return groups.map(g=>`<div class="grp">${esc(g.name)}</div>` + g.items.map(([n,v])=>{
    const val = pct ? v.toFixed(1)+'%' : num(v)+(unit||'');
    const cls = pct ? (v>=85?'g':(v>=70?'o':'r')) : '';
    return `<div class="mrow"><span class="n">${esc(n)}</span><span class="v ${cls}">${val}</span></div>`;
  }).join('')).join('');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2400);
}
</script>

const CASE_PRED = {

  TOOL_CALL:c=>c.id.startsWith('BF-ERR')||c.id.startsWith('BF-TAG'),
  TOOL_MODULE:c=>c.id.startsWith('BF-ERR')||c.id.startsWith('BF-TAG'),

  MULTI_INTENT:c=>c.id.startsWith('KQA')||c.id.startsWith('BF'),
  FUZZY_INTENT:c=>c.id.startsWith('KQA')||c.id.startsWith('ABN'),

function casesOf(code){ const p=CASE_PRED[code]; return p?DB.cases.filter(p):DB.cases; }
function filteredCases(){
  let a=casesOf(STATE.scope);

  if(STATE.caseQuery) a=a.filter(c=>(c.id+' '+c.scene+' '+c.skill).toLowerCase().includes(STATE.caseQuery.toLowerCase()));

}
function caseDetail(c, enhanced){
  const fail=c.status==='失败';
  const kv=[['路由',c.route],['命中技能',c.skill],['模式',c.mode],
            ['Token',`输入 ${num(c.tokensIn)} / 输出 ${num(c.tokensOut)}`],
            ['首 Token 延迟',c.ttft+' ms']];

  let h=`<div class="detail">`;
  if(fail&&c.reason) h+=`<div class="dtitle">失败原因</div><div class="reason">${esc(c.reason)}</div>`;
  h+=`<div class="dtitle">链路信息</div><div class="kv">`+
      kv.map(([k,v])=>`<span><b>${esc(k)}：</b>${esc(v)}</span>`).join('')+`</div>`;
  if(c.modelSteps&&c.modelSteps.length){
    h+=`<div class="dtitle">调用路径 · EvalTrace</div><div class="steps">`;
    h+=`<div class="stepbox"><div class="h">模型调用（${c.modelSteps.length}）　Agent 模型调用的路径</div>`+
        c.modelSteps.map(s=>`<div class="r"><span class="i">${s[0]}</span><span class="n">${esc(s[1])}　${esc(s[2])}</span><span class="t">${esc(s[3])}</span></div>`).join('')+`</div>`;
    h+=`<div class="stepbox"><div class="h">工具调用（${c.toolSteps.length}）　Agent 工具调用的路径</div>`+
        c.toolSteps.map(s=>`<div class="r"><span class="i">${s[0]}</span><span class="n">${esc(s[1])}</span><span class="s">成功</span><span class="t">${esc(s[2])}</span></div>`).join('')+`</div></div>`;
  }
  if(c.userInput) h+=`<div class="dtitle">用户输入</div><div class="iobox">${esc(c.userInput)}</div>`;
  if(c.agentOutput) h+=`<div class="dtitle">Agent 输出</div><div class="iobox">${esc(c.agentOutput)}</div>`;
  if(!fail&&!c.userInput) h+=`<div class="dtitle">评测说明</div><div class="iobox">主指标「任务完成率」判定通过；指令遵循、忠实性等作为质量维度单独衡量，不参与最终通过判定。</div>`;
  return h+`</div>`;
}
function caseTable(enhanced){

    const open=STATE.openCase===c.id;

  }).join('') || `<tr><td colspan="8" style="text-align:center;color:#98a2b3;padding:26px">没有匹配的用例</td></tr>`;
  return `<div class="card">
    <div class="card-h"><h3>用例明细 ${enhanced?'<span style="font-weight:500;color:var(--red);font-size:11.5px">主要包含每条用例的评测耗时、输入/输出 Token 数、模型/工具的调用次数和 Trace ID</span>':''}</h3>

    <div class="pager"><span>第 ${all.length?start+1:0}-${Math.min(start+size,all.length)} 条，共 ${all.length} 条

        <div class="card pad" style="margin-bottom:14px"><h3 style="font-size:14px;margin:0 0 10px">② 运行参数与容错</h3>
          <table class="tbl"><tbody>${DB.engine.params.map(p=>`<tr><td style="width:130px;font-weight:700">${esc(p[0])}</td><td>${esc(p[1])}</td></tr>`).join('')}</tbody></table></div>
        <div class="card pad" style="margin-bottom:14px"><h3 style="font-size:14px;margin:0 0 10px">③ 两种评测模式</h3>
          <div class="grid g2"><div class="notice info" style="margin:0"><b>E2E_REAL</b><br>走完整线上链路：真实 LLM、真实工具、真实知识库检索。反映生产表现，但受外部依赖抖动影响。</div>
          <div class="notice ok" style="margin:0"><b>E2E_MOCK</b><br>注入预设工具返回值，推理与决策仍真实。消除外部不确定性，保证结果可复现。</div></div>
          <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0">Mock 适用于 Trace 排查、可售性分析等依赖外部工具的实时性分析场景；Real 适用于 Skill 类评测与知识问答。</p></div>
        <div class="card pad"><h3 style="font-size:14px;margin:0 0 10px">④ 重试与容错</h3>
          <ul style="font-size:12px;margin:0;padding-left:20px;line-height:1.9">
            <li>执行异常（超时 / 网络错误）：最多重试 2 次，间隔 3 秒</li>
            <li>Judge 判定不通过：<b>不重试</b>，这是 Agent 能力问题</li>
            <li>单条用例 120 秒超时，避免阻塞整批评测</li>
            <li>路由误触发时，依赖 RAG 的下游 Judge 标 error 并跳过统计，<b>不进分子也不进分母</b></li>
          </ul></div>
      </div>
    </div>
    <div class="card pad"><h3 style="font-size:14px;margin:0 0 10px">⑤ EvalTrace：随链路流转的轻量轨迹结构</h3>
      <div class="grid g3">${DB.engine.traceNodes.map(([n,d])=>`<div style="border:1px solid var(--line);border-radius:9px;padding:10px 12px">
        <div style="font-size:12px;font-weight:800;color:var(--brand)">${esc(n)}</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.7">${esc(d)}</div></div>`).join('')}</div>
      <div class="notice info" style="margin-bottom:0">Agent 执行完毕后，Trace 与最终输出一起交给 Judge 引擎；「是否确实调用了某个工具」无需从回复文本推断，直接看 Trace 中的工具调用记录即可。</div>
    </div>`;
}
</script>

<script>
/* ============ 交互与初始化（纯前端，无后端） ============ */
const VIEWS=['dashboard','tasks','results','config','datasets','engine'];
const CRUMB={
  dashboard:['评测看板','Agent 应用智能评测看板'],
  tasks:['评测任务','配置评测范围并提交任务'],
  results:['评测结果','逐条下钻用例与 EvalTrace'],
  config:['评测配置','Agent / 数据集 / 指标可配置化'],
  datasets:['数据集与指标','与 Agent 架构同构的指标体系'],
  engine:['执行引擎','从用例到报告的完整链路']
};
const SCOPE_MAP={
  '基础技能':'BASIC_FUNCTION','知识库问答':'KNOWLEDGE_QA','多轮对话':'MULTI_TURN',
  '工具调用':'TOOL_CALL','多意图':'MULTI_INTENT','模糊意图':'FUZZY_INTENT',
  '异常输入':'ABNORMAL_INPUT','长对话衰减':'LONG_CONTEXT',
  '端到端':'END_TO_END','核心模块':'CORE_MODULE','感知模块':'PERCEPTION',
  '规划模块':'PLANNING','记忆模块':'MEMORY','工具模块':'TOOL_MODULE','全量评测':'FULL'
};
const CODE_NAME=Object.fromEntries(Object.entries(SCOPE_MAP).map(([n,c])=>[c,n]));

let CHART_W = 360;
function renderDashboardCharts(){ renderDashboard(); }

function reflowCharts(){
  const wrap = document.querySelector('#v-dashboard .chartwrap');
  if(wrap){
    const w = Math.round(wrap.getBoundingClientRect().width);
    if(w > 200 && Math.abs(w - CHART_W) > 2){
      CHART_W = w;
      renderDashboard();                          // 用真实像素宽重绘，viewBox 与容器 1:1
    }
  }
  syncHeader();
}

function syncHeader(){
  const tb=document.querySelector('.topbar'), tabs=document.querySelector('.tabs');
  if(!tb||!tabs) return;
  const h1=Math.round(tb.getBoundingClientRect().height);
  const h2=Math.round(tabs.getBoundingClientRect().height);
  const root=document.documentElement.style;
  root.setProperty('--topbarH',h1+'px');
  root.setProperty('--headerH',(h1+h2)+'px');
}

function render(keepFocus){
  renderRail();
  renderDashboard(); renderTasks(); renderResults(); renderConfig(); renderDatasets(); renderEngine();
  VIEWS.forEach(v=>{ $('v-'+v).hidden = v!==STATE.view; });
  document.querySelectorAll('#nav a, #tabs a').forEach(a=>
    a.classList.toggle('on', a.dataset.view===STATE.view));
  $('crumb').innerHTML=`${CRUMB[STATE.view][0]} <small>${CRUMB[STATE.view][1]}</small>`;
  $('scopeLabel').textContent='提交范围：'+STATE.submitName;
  $('agentBadge').textContent=DB.agents[STATE.agentIdx].name.replace('（',' · ').replace('）','');
  $('scopeDatasets').innerHTML=DB.scopeLists.datasets.map(n=>
    `<button class="opt ${STATE.submitCode===SCOPE_MAP[n]?'on':''}" data-code="${SCOPE_MAP[n]}" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  $('scopeModes').innerHTML=DB.scopeLists.modes.map(n=>
    `<button class="opt ${STATE.submitCode===SCOPE_MAP[n]?'on':''}" data-code="${SCOPE_MAP[n]}" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  if(keepFocus){
    const el=$(keepFocus);
    if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
  }
  reflowCharts();
}

function switchView(v){
  if(!VIEWS.includes(v)) return;
  STATE.view=v; STATE.openCase=null; STATE.casePage=1;
  $('scopePanel').classList.remove('open');
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

function selectRun(id){
  const r=DB.runs.find(x=>x.id===id); if(!r) return;
  STATE.runId=id; STATE.scope=r.code; STATE.casePage=1; STATE.openCase=null;
  STATE.caseFilter='全部'; STATE.caseQuery='';
  render(); toast(`已切换到 ${r.name} 评测记录`);
}

function exportJSON(){
  const payload={
    meta:{source:'AI Agent 应用精细化评测 · 静态演示数据',exportedAt:'2026-05-28 16:58:02',
          agent:DB.app.agent,model:DB.app.model,graph:DB.app.graph},
    scope:currentScope().code, taskId:currentRun().id,
    summary:{total:currentRun().total,pass:currentRun().pass,fail:currentRun().fail,
             skipped:currentRun().skipped||0,rate:currentRun().rate},
    metrics:currentScope().quality,
    cost:currentScope().cost, latency:currentScope().latency,
    scenes:currentScope().scenes, cases:casesOf(STATE.scope),
    datasets:DB.datasets, judgeGroups:DB.judgeGroups
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`eval-result-${currentScope().code}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('已导出当前评测范围的 JSON 结果');
}

let simTimer=null;
function startSimulation(code){
  if(STATE.running){ toast('已有评测任务在运行中'); return; }
  const stamp=Date.now();
  const use=(code&&DB.scopes[code])?code:'END_TO_END';
  STATE.running={id:`EVAL-${stamp}-demo01`,code:use,progress:8};
  STATE.view='dashboard';
  render(); toast('评测任务已提交，后台异步执行中…');
  let p=8;
  simTimer=setInterval(()=>{
    p=Math.min(100,p+Math.round(12+Math.random()*18));
    if(STATE.running) STATE.running.progress=p;
    if(p>=100){
      clearInterval(simTimer); simTimer=null;
      const done=STATE.running;
      STATE.running=null;
      const code=done.code||'END_TO_END';
      const sc=DB.scopes[code]||DB.scopes.END_TO_END;
      const t=sc.kpi.total, p=sc.kpi.pass, f=sc.kpi.fail;
      const nr={id:done.id,code:code,name:CODE_NAME[code]||sc.title,time:'05-28 17:0'+Math.floor(Math.random()*9),
                total:t,pass:p,fail:f,skipped:Math.max(0,t-p-f),rate:Math.round(p/t*1000)/10,status:'COMPLETED'};
      DB.runs.unshift(nr); STATE.runId=nr.id; STATE.scope=code;
      STATE.casePage=1; STATE.openCase=null; render();
      toast('评测已完成，结果已生成');
    }else{
      // 只更新进度文本，避免整页重绘丢焦点
      const pr=document.getElementById('runProgress');
      if(pr) pr.textContent=`轮询中… ${p}%`;
    }
  },650);
}

document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-view],[data-run],[data-code],[data-filter],[data-page],[data-case],[data-submit],[data-export],[data-cancel],[data-dismiss],[data-ds],[data-scope],[data-mod],[data-dismiss]');
  if(t){
    if(t.dataset.view){ switchView(t.dataset.view); return; }
    if(t.dataset.run){ selectRun(t.dataset.run); return; }
    if(t.dataset.code){
      // 顶部下拉是「提交新评测」的范围选择，不改写当前正在查看的评测结果
      STATE.submitCode=t.dataset.code;
      STATE.submitName=t.dataset.name||CODE_NAME[t.dataset.code]||t.dataset.code;
      $('scopePanel').classList.remove('open'); render();
      toast('已选提交范围：'+STATE.submitName+'，点击「提交评测」运行'); return;
    }
    if(t.dataset.filter){ STATE.caseFilter=t.dataset.filter; STATE.casePage=1; STATE.openCase=null; render(); return; }
    if(t.dataset.page){ STATE.casePage += (t.dataset.page==='next'?1:-1); STATE.openCase=null; render(); return; }
    if(t.dataset.case){ STATE.openCase = (STATE.openCase===t.dataset.case?null:t.dataset.case); render(); return; }
    if(t.dataset.submit){ startSimulation(STATE.taskCode); return; }
    if(t.dataset.export){ exportJSON(); return; }
    if(t.dataset.cancel){
      if(simTimer){clearInterval(simTimer);simTimer=null; STATE.running=null; render();}
      else { t.closest('.taskrow').style.display='none'; }
      toast('评测任务已取消'); return;
    }
    if(t.dataset.dismiss){ t.closest('.taskrow').style.display='none'; return; }
    if(t.dataset.ds){
      e.preventDefault();
      const n=t.dataset.ds, i=STATE.taskDatasets.indexOf(n);
      if(i>=0) STATE.taskDatasets.splice(i,1); else STATE.taskDatasets.push(n);
      render(); return;
    }
    if(t.dataset.scope){ e.preventDefault(); STATE.taskScope=t.dataset.scope; render(); return; }
    if(t.dataset.mod){ e.preventDefault(); STATE.taskModule=t.dataset.mod; render(); return; }
  }
  if(e.target.closest('#btnSubmit')){ startSimulation(STATE.submitCode); return; }
  if(e.target.closest('#scopeBtn')){
    $('scopePanel').classList.toggle('open'); return;
  }
  if(!e.target.closest('#scopeSel')) $('scopePanel').classList.remove('open');
  if(e.target.closest('#clearDs')){ STATE.taskDatasets=[]; render(); return; }
});

document.addEventListener('input',(e)=>{
  if(e.target.id==='caseQuery'){
    STATE.caseQuery=e.target.value; STATE.casePage=1; STATE.openCase=null; render('caseQuery'); return;
  }
  if(e.target.id==='runSearch'){ STATE.runSearch=e.target.value; render('runSearch'); return; }
});
document.addEventListener('change',(e)=>{
  const id=e.target.id;
  if(id==='caseSize'){ STATE.caseSize=parseInt(e.target.value,10); STATE.casePage=1; render(); return; }
  if(id==='railPageSize'){ toast('每页条数：'+e.target.value+'（演示）'); return; }
  if(id==='cfgModule'){ STATE.configModule=e.target.value; render(); return; }
  if(id==='taskAgent'||id==='cfgAgent'){ STATE.agentIdx=e.target.selectedIndex; render(); return; }
  if(id==='taskGraph'){ STATE.graph=e.target.value; render(); return; }
});

render();
window.addEventListener('resize',reflowCharts);
</script>

</body>
</html>
